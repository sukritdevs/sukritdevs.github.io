<!DOCTYPE html>
<html lang="en">

<body>

<main id="main">
  <h1 class="sr-only">Sukrit Bhatnagar: my work as a statistical model</h1>
  <div id="model" tabindex="-1" aria-label="Interactive model of my work"></div>
  <noscript><p class="page">This page draws my work as an interactive model. Without JavaScript, the full list of projects is below.</p></noscript>

  <div class="page">
    <section id="fit" hidden aria-label="How my work fits a research assistant role"></section>

    <section class="block" id="list" aria-labelledby="listh">
      <h2 class="serif" id="listh">Everything, as a list</h2>
      <p class="lede">The same work without the diagram, grouped by factor. Unpublished projects show only the question and the method.</p>
      <div class="lwrap" id="lgrid"></div>
    </section>

  </div>
</main>

<footer class="foot" id="about" aria-labelledby="abouth"></footer>

<script src="assets/model.js"></script>
<script>
(function () {
  'use strict';
  var PF = window.PF;
  var $ = function (s) { return document.querySelector(s); };
  function h(t, a, p) { var e = document.createElement(t); for (var k in a) { if (k === 'text') e.textContent = a[k]; else e.setAttribute(k, a[k]); } if (p) p.appendChild(e); return e; }

  /* the role-fit panel has no button. Adding #research to the address opens it. */
  var fit = $('#fit');
  h('h2', { text: 'How my work fits a research assistant role' }, fit);
  var rows = h('div', { 'class': 'fit-rows' }, fit);
  PF.fit.forEach(function (r) { var d = h('div', { 'class': 'fit-row' + (r[0] === 'An honest gap' ? ' gap' : '') }, rows); h('b', { text: r[0] }, d); h('span', { text: r[1] }, d); });
  function syncFit() { var on = location.hash === '#research'; fit.hidden = !on; if (on) fit.scrollIntoView(); }
  window.addEventListener('hashchange', syncFit); syncFit();

  if (/[?&]adjust(&|$)/.test(location.search)) { var adj = document.createElement('script'); adj.src = 'assets/adjust.js'; document.body.appendChild(adj); } /* the framing tuner for the footer portrait */

  /* the footer: portrait, a short bio and every link, all copy from content.js */
  var A = PF.about, foot = $('#about');
  if (A && foot) {
    var inn = h('div', { 'class': 'foot-in' }, foot);
    var fig = h('figure', {}, inn), pic = h('picture', {}, fig);
    h('source', { type: 'image/webp', srcset: A.photo.webp }, pic);
    h('img', { src: A.photo.jpg, alt: A.photo.alt, width: '867', height: '1156', loading: 'lazy', decoding: 'async' }, pic);
    var bio = h('div', { 'class': 'foot-bio' }, inn);
    h('h2', { 'class': 'serif', id: 'abouth', text: A.heading }, bio);
    A.paras.forEach(function (x) { h('p', { text: x }, bio); });
    var nav = h('nav', { 'class': 'foot-links', 'aria-label': 'Elsewhere' }, inn);
    A.links.forEach(function (l) { h('a', { 'class': 'btn' + (l[2] ? ' ' + l[2] : ''), href: PF.links[l[1]], target: '_blank', rel: 'noopener', text: l[0] + ' \u2197' }, nav); });
    if (A.note) h('p', { 'class': 'foot-note', text: A.note }, nav);
    var end = h('div', { 'class': 'foot-end' }, foot); h('span', { text: '\u00A9 2026 Sukrit Bhatnagar' }, end);
  }

})();
</script>
</body>
</html>
