<!DOCTYPE html>

<main id="main">
  <div class="page">
    <header class="phead">
      <h1 class="serif">Small experiments, each from a project in the model</h1>
      <p class="lede">Start anywhere. Each toy opens with a “Start here” line, runs on invented data so the true answer is known, and links back to the project it comes from.</p>

    <div class="pgrid" id="pgrid"></div>

    <p class="pback"><a href="index.html">← Back to the model</a></p>

    <footer class="site">
      <a href="https://linkedin.com/sukritbhatnagar" target="_blank" rel="noopener">LinkedIn</a>

</main>

<script>
(function () {
  'use strict';
  var PF = window.PF, U = window.PFUI;
  function h(t, a, p) { var e = document.createElement(t); for (var k in a) { if (k === 'text') e.textContent = a[k]; else e.setAttribute(k, a[k]); } if (p) p.appendChild(e); return e; }
  var g = document.getElementById('pgrid');
  PF.toys.forEach(function (t) {
    var m = U.find(t.from[0]), c = h('article', { 'class': 'pcard' }, g);
    c.style.setProperty('--c', m.f.col);
    var top = h('div', { 'class': 'pc-top' }, c);
    top.appendChild(U.glyph(m.f, m.d, 'index.html?open=' + m.d.id, m.d.title + ', under ' + m.f.name + '. See it in the model.'));
    var b = h('div', { 'class': 'pc-b' }, c);
    h('h2', { text: t.title }, b);
    h('p', { 'class': 'pc-q', text: t.q }, b);
    var act = h('div', { 'class': 'pc-act' }, b);
    h('a', { 'class': 'go', href: t.file, text: 'Play it' }, act);
    var srcp = h('p', { 'class': 'pc-src' }, b); srcp.appendChild(document.createTextNode('Source project: ')); h('a', { href: 'index.html?open=' + m.d.id, text: m.f.name + ' › ' + m.d.title }, srcp);
  });
})();
</script>
</body>
</html>
